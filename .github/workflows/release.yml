name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish without publishing the package
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Rebuild ReScript code
        run: npm run build

      - name: Check public feature builds
        run: npm run check:features

      - name: Run tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Build documentation
        run: npm run build:docs

      - name: Check documentation links
        run: npm run check:docs-links

      - name: Run negative compiler consumers
        run: npm run test:negative

      - name: Validate explicit alpha version and unpublished state
        run: npm run check:release

      - name: Package release artifact
        id: package
        run: |
          mkdir -p .release
          npm pack --json --pack-destination .release > .release/metadata.json
          artifact="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(".release/metadata.json", "utf8"))[0].filename)')"
          echo "artifact=.release/$artifact" >> "$GITHUB_OUTPUT"

      - name: Verify packed consumers and tarball contents
        run: npm run check:consumer -- "${{ steps.package.outputs.artifact }}"

      - name: Dry-run npm publish
        if: github.event_name == 'pull_request' || inputs.dry_run
        run: npm publish "${{ steps.package.outputs.artifact }}" --access public --tag alpha --dry-run

      - name: Reject real publication from non-main branches
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref != 'refs/heads/main'
        run: |
          echo "Real alpha publication is permitted only from main."
          exit 1

      - name: Verify publication guard
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run
        run: npm run check:release -- --publish

      - name: Publish alpha artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run
        run: npm publish "${{ steps.package.outputs.artifact }}" --access public --tag alpha --provenance
